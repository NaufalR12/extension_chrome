<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BERIBUG</title>
  <link rel="stylesheet" href="../css/popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="header">
      <div class="logo-container">
        <div class="logo-icon">🐞</div>
        <div class="logo-text">BERIBUG</div>
      </div>
      <div class="user-status hidden" id="userStatusWrapper">
        <span class="status-dot" id="statusDot"></span> 
        <span id="userStatus">Ready</span>
        <span id="recordingTimer" class="timer-badge hidden">00:00</span>
      </div>
    </div>
    
    <!-- Login State -->
    <div id="loginSection" class="section login-section">
      <div class="login-illustration">☁️</div>
      <h2>Connect Drive</h2>
      <p>Please authenticate with your Google account to enable cloud saving.</p>
      <button id="btnLogin" class="btn primary-btn btn-large w-100">Login with Google</button>
    </div>

    <!-- Main State -->
    <div id="mainSection" class="section hidden">
      <div id="mainActions" class="action-grid">
        <button id="btnRecord" class="action-card">
          <div class="card-icon blue">🎥</div>
          <div class="card-label">Record</div>
        </button>
        <button id="btnStop" class="action-card hidden recording-active">
          <div class="card-icon red pulse">⏹</div>
          <div class="card-label">Stop</div>
        </button>
        
        <button id="btnScreenshot" class="action-card">
          <div class="card-icon purple">📸</div>
          <div class="card-label">Screenshot</div>
        </button>
        
        <button id="btnDashboard" class="action-card">
          <div class="card-icon gray">📋</div>
          <div class="card-label">Dashboard</div>
        </button>
      </div>

      <!-- Screenshot Mode (inside popup) -->
      <div id="screenshotSection" class="section hidden">
        <h2>Screenshot</h2>
        <p>Pilih mode screenshot:</p>
        <div class="action-grid">
          <button id="btnShotArea" class="action-card">
            <div class="card-icon purple">✂️</div>
            <div class="card-label">Area</div>
          </button>
          <button id="btnShotFull" class="action-card">

            <div class="card-icon purple">�📄</div>
            <div class="card-label">Full Page</div>
          </button>
          <button id="btnShotScroll" class="action-card">
            <div class="card-icon purple">📜</div>
            <div class="card-label">Scroll</div>
          </button>
          <button id="btnShotBack" class="action-card">
            <div class="card-icon gray">↩️</div>
            <div class="card-label">Kembali</div>
          </button>
        </div>
      </div>

      <div class="settings-divider">
        <span>Settings</span>
      </div>
      
      <div class="setting-group">
        <label>Auto-delete Drive (Days)</label>
        <div class="input-line">
           <input type="number" id="inputAutoDelete" value="30">
           <button id="btnSaveSettings" class="btn small-btn outline-btn">Save</button>
        </div>
        <div id="settingsMsg" class="success-msg hidden">Preferences Saved!</div>
      </div>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>
</html>
